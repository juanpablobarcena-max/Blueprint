<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidePlanos PRO - Tooltips & Workflow</title>
    
    <!-- Librería PDF.js de Mozilla -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <!-- Tipografía profesional Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #0ea5e9; --primary-hover: #0284c7; --primary-glow: rgba(14, 165, 233, 0.3);
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444; --magic: #a855f7;
            --circle: #ec4899; --curve: #14b8a6; --cad: #64748b;
            --bg-body: #0f172a; --bg-panel: rgba(30, 41, 59, 0.96); --border: #334155;
            --text-main: #f8fafc; --text-muted: #94a3b8;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-body); margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; color: var(--text-main); }
        
        /* HEADER */
        .header { background: var(--bg-panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 6px 16px; border-bottom: 1px solid var(--border); z-index: 100; display: flex; flex-direction: column; gap: 6px; }
        .toolbar-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .toolbar-group { display: flex; gap: 8px; align-items: center; }
        .toolbar-group.tools-top { border-left: 1px solid var(--border); border-right: 1px solid var(--border); padding: 0 12px; }
        
        button { border: none; cursor: pointer; font-family: inherit; outline: none; }
        button:not(.tool-btn) { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; font-weight: 600; font-size: 11px; transition: 0.2s; background: #1e293b; color: var(--text-main); }
        button:not(.tool-btn):hover { background: #334155; border-color: #475569; }
        
        .btn-action { background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%) !important; color: white !important; border-color: #1d4ed8 !important; }
        .btn-close { background: rgba(239, 68, 68, 0.1) !important; color: #fca5a5 !important; border-color: #ef4444 !important; }
        .btn-close:hover { background: var(--danger) !important; color: white !important; }
        
        .tool-trigger.active { background: #0ea5e9; color: white; border-color: #0ea5e9; box-shadow: 0 0 0 2px var(--primary-glow); }
        .tool-trigger.btn-success.active { background: var(--success); color: white; border-color: var(--success); }
        .tool-trigger.btn-magic { background: rgba(168, 85, 247, 0.1); color: #d8b4fe; border-color: rgba(168, 85, 247, 0.4); }
        .tool-trigger.btn-magic.active { background: var(--magic); color: white; border-color: var(--magic); }

        input[type="file"] { display: none; }
        .file-label { padding: 6px 10px; background: linear-gradient(180deg, #334155 0%, #1e293b 100%); color: white; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 11px; display: inline-block; border: 1px solid #475569; }
        .file-label:hover { background: #334155; }
        
        .controls-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(15, 23, 42, 0.4); padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border); }
        .controls-left { display: flex; gap: 16px; align-items: center; }
        .pdf-controls { display: none; align-items: center; gap: 6px; border-right: 1px solid var(--border); padding-right: 12px; }
        .page-input { width: 35px; text-align: center; font-size: 12px; font-weight: 600; background: #0f172a; color: white; border: 1px solid var(--border); border-radius: 4px; padding: 4px; }
        .page-input:focus { border-color: #0ea5e9; outline: none; }
        
        .zoom-controls { display: flex; align-items: center; gap: 6px; }
        .zoom-controls span { font-weight: 600; color: var(--text-muted); font-size: 11px; text-transform: uppercase; }
        .zoom-btn { padding: 2px 8px !important; border-radius: 4px !important; font-size: 13px !important;}
        
        .status-text { font-size: 12px; font-weight: 500; color: #fcd34d; background: rgba(245, 158, 11, 0.1); padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(245, 158, 11, 0.2); }
        .scale-badge { font-size: 11px; font-weight: 700; color: #fca5a5; padding: 4px 8px; border-radius: 4px; background: rgba(239, 68, 68, 0.1); border: 1px dashed #ef4444; transition: 0.3s;}
        .scale-badge.calibrated { color: #6ee7b7; border-color: #10b981; background: rgba(16, 185, 129, 0.1); border-style: solid; }

        /* LEFT TOOLBAR: overflow-visible para que los tooltips salgan de la barra */
        .left-toolbar { width: 54px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 6px; z-index: 50; overflow: visible; }
        .tool-btn { width: 36px; height: 36px; flex-shrink: 0; border-radius: 8px; background: #1e293b; border: 1px solid var(--border); color: var(--text-main); display: flex; align-items: center; justify-content: center; font-size: 15px; transition: 0.2s; position: relative; padding: 0;}
        .tool-btn:hover { background: #334155; border-color: #475569;}
        
        /* TOOLTIPS EMERGENTES */
        .tool-btn::after { 
            content: attr(data-tooltip); position: absolute; left: 100%; top: 50%; transform: translateY(-50%) translateX(5px); 
            margin-left: 8px; background: #0f172a; color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 11px; 
            font-weight: 600; white-space: nowrap; opacity: 0; visibility: hidden; transition: 0.2s; pointer-events: none; 
            border: 1px solid var(--border); z-index: 9999; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .tool-btn::before { 
            content: ""; position: absolute; left: 100%; top: 50%; transform: translateY(-50%) translateX(5px); 
            margin-left: 2px; border-width: 5px; border-style: solid; border-color: transparent #0f172a transparent transparent; 
            opacity: 0; visibility: hidden; transition: 0.2s; z-index: 9999; pointer-events: none;
        }
        .tool-btn:hover::after, .tool-btn:hover::before { opacity: 1; visibility: visible; transform: translateY(-50%) translateX(0); }

        /* WORKSPACE & CANVAS */
        .main-container { display: flex; flex: 1; overflow: hidden; }
        .workspace { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow: hidden; background-color: var(--bg-body); background-image: radial-gradient(#334155 1.5px, transparent 1.5px); background-size: 24px 24px; z-index: 1;}
        .canvas-container { flex: 1; overflow: auto; background: white; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); position: relative; border: 1px solid #000; }
        canvas { display: block; transform-origin: top left; transition: width 0.1s, height 0.1s; }

        /* LUPA DE PRECISIÓN */
        #loupeCanvas { position: fixed; pointer-events: none; border-radius: 50%; border: 2px solid #0ea5e9; box-shadow: 0 5px 15px rgba(0,0,0,0.6); display: none; z-index: 9999; background: white; }

        /* SIDEBAR RESIZER & RIGHT SIDEBAR */
        .resizer { width: 5px; background: var(--bg-body); cursor: ew-resize; transition: 0.2s; z-index: 20; border-left: 1px solid var(--border); }
        .resizer:hover, .resizer.resizing { background: #0ea5e9; }
        .sidebar { width: 340px; background: var(--bg-panel); display: flex; flex-direction: column; z-index: 5; }
        .sidebar-header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: rgba(15, 23, 42, 0.4); }
        .sidebar-header h3 { margin: 0; font-size: 13px; font-weight: 700; display: flex; justify-content: space-between; }
        .measurement-list { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .empty-state { text-align: center; color: var(--text-muted); font-size: 12px; margin-top: 20px; }
        
        /* ITEMS SIDEBAR - FILA ÚNICA */
        .measure-item { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; background: #1e293b; display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 8px; border-left: 4px solid var(--primary); transition: 0.2s; cursor: pointer; }
        .measure-item:hover, .measure-item.highlighted { background: #334155; border-color: #64748b; transform: translateX(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .measure-item.selected { background: #1e293b; border-color: #0ea5e9; box-shadow: inset 0 0 0 1px #0ea5e9; }
        
        .measure-item.type-area { border-left-color: var(--success); }
        .measure-item.type-polygonal { border-left-color: var(--warning); }
        .measure-item.type-autoline { border-left-color: var(--magic); }
        .measure-item.type-dimension { border-left-color: var(--cad); }
        
        .color-picker { -webkit-appearance: none; border: none; width: 16px; height: 16px; border-radius: 4px; cursor: pointer; padding: 0; background: transparent; flex-shrink: 0;}
        .color-picker::-webkit-color-swatch-wrapper { padding: 0; }
        .color-picker::-webkit-color-swatch { border: 1px solid #475569; border-radius: 4px; }
        
        .measure-name { font-family: inherit; font-size: 11px; font-weight: 600; border: 1px solid transparent; padding: 2px 4px; border-radius: 4px; flex-grow: 1; min-width: 40px; background: transparent; color: white; cursor: text; }
        .measure-name:focus { border-color: #0ea5e9; background: #0f172a; outline: none; }
        
        .measure-values { font-size: 11px; color: var(--text-muted); display: flex; flex-direction: row; align-items: center; gap: 4px; white-space: nowrap; flex-shrink: 0; cursor: default; }
        .measure-values span { font-weight: 700; color: #e2e8f0; font-size: 11px; }

        .btn-delete { background: #0f172a !important; border: 1px solid var(--border) !important; color: var(--text-muted) !important; padding: 4px 6px !important; border-radius: 4px !important; font-size: 10px; transition: 0.2s; flex-shrink: 0; cursor: pointer;}
        .btn-delete:hover { color: #fca5a5 !important; background: #7f1d1d !important; }

        .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); background: rgba(15, 23, 42, 0.4); }
        .btn-export { width: 100%; background: linear-gradient(180deg, #10b981 0%, #059669 100%) !important; color: white !important; border-color: #059669 !important; padding: 10px !important; font-size: 13px; border-radius: 6px;}
    </style>
</head>
<body>

    <!-- LUPA DE PRECISIÓN FLOTANTE -->
    <canvas id="loupeCanvas" width="120" height="120"></canvas>

    <div class="header">
        <div class="toolbar-row">
            <div class="toolbar-group">
                <label class="file-label">📄 Nuevo <input type="file" id="imageLoader" accept="image/png, image/jpeg, image/webp, application/pdf"/></label>
                <button id="btnSave" class="btn-action">💾 Guardar Proyecto</button>
                <label class="file-label" style="background: linear-gradient(180deg, #475569 0%, #334155 100%); border-color:#475569;">📂 Abrir <input type="file" id="projectLoader" accept=".json"/></label>
                
                <button id="btnPrint" style="background:#0f172a; color:white; border-color:#334155;">🖨️ Imprimir Todo</button>
                <button data-mode="printArea" class="tool-trigger" style="background:#1e293b; color:white; border-color:#334155; display:flex; align-items:center; gap:6px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="5 5"><rect x="2" y="2" width="20" height="20" rx="2"/></svg> Imprimir Área
                </button>
            </div>
            
            <div class="toolbar-group tools-top">
                <button data-mode="select" class="tool-trigger">↖️ Mover / Seleccionar</button>
                <button data-mode="calibrate" class="tool-trigger">📏 Calibrar</button>
                <button data-mode="distance" class="tool-trigger">➖ Recta</button>
                <button data-mode="dimension" class="tool-trigger" style="color:#94a3b8;">|↔| Acotar</button>
                <button data-mode="arc" class="tool-trigger" style="color:var(--curve); border-color:transparent;">⌒ Curva</button>
                <button data-mode="polygonal" class="tool-trigger">〰️ Poligonal</button>
                <button data-mode="area" class="tool-trigger btn-success">⬟ Área</button>
                <button data-mode="circle" class="tool-trigger" style="color:var(--circle); border-color:transparent;">⭕ Círculo</button>
                <button data-mode="autoLine" class="tool-trigger btn-magic">🪄 Auto-Línea</button>
                <button data-mode="autoArea" class="tool-trigger btn-magic">🪄 Auto-Área</button>
            </div>

            <div class="toolbar-group">
                <button id="btnToggleSidebar" style="background:#334155; color:white; border-color:#475569;">🗂️ Panel</button>
                <button id="btnClose" class="btn-close">❌ Cerrar</button>
            </div>
        </div>

        <div class="toolbar-row controls-bar">
            <div class="controls-left">
                <div class="pdf-controls" id="pdfControls">
                    <button class="zoom-btn" id="btnPrev">◀</button>
                    <span style="font-size: 12px; font-weight: 600;">
                        Pág <input type="number" id="pageInput" class="page-input" value="1" min="1"> de <span id="pageTotal">1</span>
                    </span>
                    <button class="zoom-btn" id="btnNext">▶</button>
                </div>
                <div class="zoom-controls">
                    <span>🔍 Zoom:</span>
                    <button class="zoom-btn" id="btnZoomOut">➖</button>
                    <span id="zoomLevel">100%</span>
                    <button class="zoom-btn" id="btnZoomIn">➕</button>
                </div>
                <div id="statusText" class="status-text">Sube un plano o abre un proyecto.</div>
            </div>
            <div id="scaleInfo" class="scale-badge">ESCALA NO CALIBRADA</div>
        </div>
    </div>

    <div class="main-container">
        <!-- BARRA IZQUIERDA -->
        <div class="left-toolbar">
            <button data-mode="select" class="tool-btn tool-trigger" data-tooltip="Mover / Seleccionar">↖️</button>
            <hr style="width: 50%; border: 0; border-top: 1px solid var(--border); margin: 0;">
            <button data-mode="calibrate" class="tool-btn tool-trigger" data-tooltip="Calibrar Escala">📏</button>
            <button data-mode="distance" class="tool-btn tool-trigger" data-tooltip="Línea Recta">➖</button>
            
            <button data-mode="dimension" class="tool-btn tool-trigger" data-tooltip="Acotación CAD" style="color:#94a3b8; font-size:13px; font-weight:bold; letter-spacing:-1px;">|↔|</button>
            
            <button data-mode="arc" class="tool-btn tool-trigger" data-tooltip="Arco / Curva" style="color:var(--curve);">⌒</button>
            <button data-mode="polygonal" class="tool-btn tool-trigger" data-tooltip="Línea Poligonal">〰️</button>
            <button data-mode="area" class="tool-btn btn-success tool-trigger" data-tooltip="Área Manual">⬟</button>
            <button data-mode="circle" class="tool-btn tool-trigger" data-tooltip="Círculo" style="color:var(--circle);">⭕</button>
            <hr style="width: 50%; border: 0; border-top: 1px solid var(--border); margin: 0;">
            
            <button data-mode="printArea" class="tool-btn tool-trigger" data-tooltip="Imprimir Área" style="color:var(--text-main);">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="5 5"><rect x="2" y="2" width="20" height="20" rx="2"/></svg>
            </button>
            
            <hr style="width: 50%; border: 0; border-top: 1px solid var(--border); margin: 0;">
            <button data-mode="autoLine" class="tool-btn btn-magic tool-trigger" data-tooltip="Auto-Línea">✨</button>
            <button data-mode="autoArea" class="tool-btn btn-magic tool-trigger" data-tooltip="Auto-Área">🔮</button>
        </div>

        <div class="workspace">
            <div class="canvas-container" id="canvasContainer">
                <canvas id="planCanvas"></canvas>
            </div>
        </div>

        <div class="resizer" id="sidebarResizer"></div>

        <div class="sidebar" id="rightSidebar">
            <div class="sidebar-header">
                <h3>Mediciones <span id="sbPageTitle" style="color:var(--text-muted); font-size:11px;"></span></h3>
            </div>
            <div class="measurement-list" id="measurementList">
                <div class="empty-state">No hay medidas en esta página.</div>
            </div>
            <div class="sidebar-footer">
                <button id="btnExport" class="btn-export">Descargar Excel (.CSV)</button>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const canvas = document.getElementById('planCanvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.getElementById('canvasContainer');
        const imageLoader = document.getElementById('imageLoader');
        const projectLoader = document.getElementById('projectLoader');
        const measurementListEl = document.getElementById('measurementList');
        const pageInput = document.getElementById('pageInput');
        
        const loupeCanvas = document.getElementById('loupeCanvas');
        const loupeCtx = loupeCanvas.getContext('2d');
        
        let img = new Image();
        let mode = 'none'; 
        let currentZoom = 1;
        let measurementsByPage = {};
        let counters = { line: 1, area: 1, circle: 1, arc: 1, dimension: 1 };
        
        let scaleByPage = {};
        let lastKnownScale = 0; 

        let currentFileDataURL = null; let currentFileType = null; let currentFileName = null;
        let pdfDoc = null; let pageNum = 1; 

        // VARIABLES FLUJO CLIC A CLIC
        let isDrawing = false; 
        let startX, startY, endX, endY;
        let currentPath = []; 
        let tempPoint = null;
        let measureStep = 0; 
        let isLoupeActive = false; 

        let isPanning = false; let panStartX, panStartY, panScrollLeft, panScrollTop;
        let draggingLabel = null; let dragOffsetX = 0; let dragOffsetY = 0;
        
        let editingMeasureId = null;
        let draggingPointIndex = -1;
        let highlightedMeasureId = null;

        function getDefaultColor(type) {
            if (type === 'straight') return '#0ea5e9';
            if (type === 'dimension') return '#3b82f6';
            if (type === 'polygonal') return '#f59e0b';
            if (type === 'area' || type === 'autoArea') return '#10b981';
            if (type === 'circle') return '#ec4899';
            if (type === 'arc') return '#14b8a6';
            if (type === 'autoLine') return '#a855f7';
            return '#ffffff';
        }

        function hexToRgba(hex, alpha) {
            if(!hex) return `rgba(255,255,255,${alpha})`;
            hex = hex.replace('#', '');
            if(hex.length === 3) hex = hex.split('').map(x => x + x).join('');
            let r = parseInt(hex.substring(0,2), 16), g = parseInt(hex.substring(2,4), 16), b = parseInt(hex.substring(4,6), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function getMousePos(e) { 
            const rect = canvas.getBoundingClientRect(); 
            return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) }; 
        }

        // --- MATEMÁTICAS ---
        function getArcThrough3Points(p1, p2, p3) {
            let temp = p2.x*p2.x + p2.y*p2.y;
            let bc = (p1.x*p1.x + p1.y*p1.y - temp) / 2;
            let cd = (temp - p3.x*p3.x - p3.y*p3.y) / 2;
            let det = (p1.x - p2.x) * (p2.y - p3.y) - (p2.x - p3.x) * (p1.y - p2.y);
            if (Math.abs(det) < 1e-5) return null; 
            
            let cx = (bc * (p2.y - p3.y) - cd * (p1.y - p2.y)) / det;
            let cy = ((p1.x - p2.x) * cd - (p2.x - p3.x) * bc) / det;
            let r = Math.hypot(cx - p1.x, cy - p1.y);
            
            let startAngle = Math.atan2(p1.y - cy, p1.x - cx);
            let endAngle = Math.atan2(p3.y - cy, p3.x - cx);
            let cross = (p2.x - p1.x) * (p3.y - p2.y) - (p2.y - p1.y) * (p3.x - p2.x);
            let anticlockwise = cross < 0; 
            
            let sweepAngle = endAngle - startAngle;
            if (anticlockwise && sweepAngle > 0) sweepAngle -= 2 * Math.PI;
            if (!anticlockwise && sweepAngle < 0) sweepAngle += 2 * Math.PI;
            let length = Math.abs(sweepAngle) * r;
            
            return { cx, cy, r, startAngle, endAngle, anticlockwise, length };
        }

        function getCADOffset(p1, p2, p3) {
            let dx = p2.x - p1.x; let dy = p2.y - p1.y;
            let len = Math.hypot(dx, dy);
            if (len === 0) return { d: 0, nx: 0, ny: 0, dx: 0, dy: 0, len: 0 };
            let nx = -dy / len; let ny = dx / len;
            let d = (p3.x - p1.x) * nx + (p3.y - p1.y) * ny;
            return { d, nx, ny, dx, dy, len };
        }

        // --- RESIZER PANEL LATERAL ---
        const resizer = document.getElementById('sidebarResizer');
        const rightSidebar = document.getElementById('rightSidebar');
        let isResizing = false;
        resizer.addEventListener('mousedown', () => { isResizing = true; document.body.style.cursor = 'ew-resize'; resizer.classList.add('resizing'); });
        document.addEventListener('mousemove', (e) => { if (!isResizing) return; const newWidth = document.body.clientWidth - e.clientX; if (newWidth > 200 && newWidth < 600) rightSidebar.style.width = newWidth + 'px'; });
        document.addEventListener('mouseup', () => { if (isResizing) { isResizing = false; document.body.style.cursor = 'default'; resizer.classList.remove('resizing'); } });
        document.getElementById('btnToggleSidebar').onclick = () => { if (rightSidebar.style.display === 'none') { rightSidebar.style.display = 'flex'; resizer.style.display = 'block'; } else { rightSidebar.style.display = 'none'; resizer.style.display = 'none'; } };

        // --- IMPRESIÓN ---
        document.getElementById('btnPrint').onclick = () => {
            if (!img.src) return alert("Sube un plano antes de imprimir.");
            openPrintWindow(canvas.toDataURL('image/png'));
        };

        function printSelectedArea(x, y, w, h) {
            const tCanvas = document.createElement('canvas'); tCanvas.width = w; tCanvas.height = h;
            const tCtx = tCanvas.getContext('2d');
            tCtx.drawImage(canvas, x, y, w, h, 0, 0, w, h);
            openPrintWindow(tCanvas.toDataURL('image/png'));
        }

        function openPrintWindow(dataUrl) {
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html><head><title>Imprimir - MidePlanos</title><style>
                @page { size: auto; margin: 0mm; } body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #fff; } img { max-width: 100vw; max-height: 100vh; object-fit: contain; }

        // --- SISTEMA DE RECALCULO AL EDITAR ---
        function recalculateMeasurement(m, currScale) {
            if (!currScale) return;
            if (m.type === 'straight') {
                let dist = Math.hypot(m.points[1].x - m.points[0].x, m.points[1].y - m.points[0].y);
                m.valM = (dist / currScale).toFixed(2); m.cx = (m.points[0].x + m.points[1].x)/2; m.cy = (m.points[0].y + m.points[1].y)/2;
            } 
            else if (m.type === 'dimension') {
                let dist = Math.hypot(m.points[1].x - m.points[0].x, m.points[1].y - m.points[0].y);
                m.valM = (dist / currScale).toFixed(2);
                let cad = getCADOffset(m.points[0], m.points[1], m.points[2]);
                m.cx = (m.points[0].x + m.points[1].x)/2 + cad.d * cad.nx; m.cy = (m.points[0].y + m.points[1].y)/2 + cad.d * cad.ny;
            }

                m.valM = (t / currScale).toFixed(2); m.cx = m.points[m.points.length-1].x; m.cy = m.points[m.points.length-1].y;
            }
            else if (m.type === 'area') {

                for(let i=0; i<n; i++) {
                    let p1 = m.points[i], p2 = m.points[(i+1)%n];

                }
                m.valM = (per / currScale).toFixed(2); m.valM2 = (Math.abs(ar)/2/(currScale*currScale)).toFixed(2); m.cx = cX / n; m.cy = cY / n;
            }
            else if (m.type === 'circle' || m.type === 'arc') {
                let geom = getArcThrough3Points(m.points[0], m.points[2], m.points[1]);
                if (geom) {
                    let rM = geom.r / currScale; m.radiusM = rM.toFixed(2);
                    if (m.type === 'circle') {
                        m.valM = (2 * Math.PI * rM).toFixed(2); m.valM2 = (Math.PI * rM * rM).toFixed(2);
                        m.cx = geom.cx; m.cy = geom.cy; m.r = geom.r;
                    } else { m.valM = (geom.length / currScale).toFixed(2); m.cx = m.points[2].x; m.cy = m.points[2].y; }
                } else {
                    let dist = Math.hypot(m.points[1].x - m.points[0].x, m.points[1].y - m.points[0].y); m.valM = (dist / currScale).toFixed(2); m.radiusM = "0.00";
                }
            }
        }

        function executeAutoMeasurement(startX, startY, autoMode) {
            document.getElementById('statusText').innerText = "🪄 Procesando imagen...";
            setTimeout(() => {
                const width = canvas.width; const height = canvas.height; const imgData = ctx.getImageData(0, 0, width, height); const data = imgData.data;
                const sx = Math.floor(startX); const sy = Math.floor(startY);

                const visited = new Uint8Array(width * height); const stack = [sx, sy]; visited[sy * width + sx] = 1;

                    if(x < minX) minX = x; if(x > maxX) maxX = x; if(y < minY) minY = y; if(y > maxY) maxY = y;
                    const idx = (y * width + x) * 4; oData.data[idx] = 255; oData.data[idx+1] = 255; oData.data[idx+2] = 255; oData.data[idx+3] = autoMode === 'autoArea' ? 120 : 255; pCount++;
                    [[x+1,y], [x-1,y], [x,y+1], [x,y-1]].forEach(([nx,ny]) => {
                        if(nx >= 0 && nx < width && ny >= 0 && ny < height) { const i = ny * width + nx; if(!visited[i] && Math.abs(data[i*4]-tr)<=tolerance && Math.abs(data[i*4+1]-tg)<=tolerance && Math.abs(data[i*4+2]-tb)<=tolerance) { visited[i] = 1; stack.push(nx, ny); } }
                    });
                }
                if(pCount < 10) { setMode(mode); return alert("No se detectó un área suficiente."); }

                    else {
                        let maxD = 0, px = sx, py = sy; for(let y=0; y<height; y++) for(let x=0; x<width; x++) if(visited[y*width+x]){ const d = Math.hypot(x-sx, y-sy); if(d>maxD){maxD=d; px=x; py=y;} }
                        let d2 = 0, p2x = px, p2y = py; for(let y=0; y<height; y++) for(let x=0; x<width; x++) if(visited[y*width+x]){ const d = Math.hypot(x-px, y-py); if(d>d2){d2=d; p2x=x; p2y=y;} }
                        addMeasurement({ type: 'autoLine', img: resImg, cx: (px+p2x)/2, cy: (py+p2y)/2, valM: (d2/currScale).toFixed(2), valM2: null });
                    } 
                }; resImg.src = overlayCanvas.toDataURL();
            }, 50); 
        }

        function getLabelAtPos(x, y) {
            const list = measurementsByPage[pageNum] || [];
            for (let i = list.length - 1; i >= 0; i--) {
                const m = list[i]; if (!m.lblOffset) continue;
                const rx = m.cx + m.lblOffset.x, ry = m.cy + m.lblOffset.y;
                const boxHeight = (m.type === 'straight' || m.type === 'dimension' || m.type === 'polygonal' || m.type === 'autoLine' || m.type === 'arc') ? 18 : 32;
                if (x >= rx - 50 && x <= rx + 50 && y >= ry - 14 && y <= ry - 14 + boxHeight) return m;
            } return null;
        }

        function getPointAtPos(m, x, y) {
            if (!m.points) return -1;
            for (let i = 0; i < m.points.length; i++) {
                if (Math.hypot(x - m.points[i].x, y - m.points[i].y) < 15) return i; 
            } return -1;
        }

        // --- RATÓN E INTERACCIÓN CLIC A CLIC ---
        canvas.addEventListener('contextmenu', (e) => { 
            e.preventDefault(); 
            if (['polygonal', 'area'].includes(mode) && currentPath.length > 0) {
                if (measureStep >= 2) {
                    if (['calibrate', 'distance'].includes(mode)) { endX = currentPath[currentPath.length-1].x; endY = currentPath[currentPath.length-1].y; finishLineTool(); }
                    else { finish3PointTool(); } 
                }
            } 
            else { isLoupeActive = false; isDrawing = false; measureStep = 0; loupeCanvas.style.display = 'none'; currentPath = []; tempPoint = null; redraw(); }
        });
        
        document.addEventListener('keydown', (e) => { 
            if (e.key === 'Escape') { isLoupeActive = false; isDrawing = false; measureStep = 0; loupeCanvas.style.display = 'none'; currentPath = []; tempPoint = null; redraw(); } 
        });

        canvas.addEventListener('mousedown', (e) => {
            if (mode === 'none' || canvas.width === 0) return; const {x, y} = getMousePos(e);
            
            if (mode === 'select') {
                if (editingMeasureId) {
                    const m = (measurementsByPage[pageNum] || []).find(val => val.id === editingMeasureId);
                    if (m && m.type !== 'autoArea' && m.type !== 'autoLine') {
                        const ptIdx = getPointAtPos(m, x, y);
                        if (ptIdx !== -1) { draggingPointIndex = ptIdx; canvas.style.cursor = 'grabbing'; return; }
                    }
                }
                const clickedLabel = getLabelAtPos(x, y);
                if (clickedLabel) { 
                    editingMeasureId = clickedLabel.id; updateSidebar(); 
                    draggingLabel = clickedLabel; dragOffsetX = x - (clickedLabel.cx + clickedLabel.lblOffset.x); dragOffsetY = y - (clickedLabel.cy + clickedLabel.lblOffset.y); 
                    canvas.style.cursor = 'move'; redraw(); return; 
                }
                editingMeasureId = null; updateSidebar(); redraw();
                isPanning = true; panStartX = e.clientX; panStartY = e.clientY; panScrollLeft = canvasContainer.scrollLeft; panScrollTop = canvasContainer.scrollTop; canvas.style.cursor = 'grabbing'; 
                return;
            }

            if (mode === 'printArea') { startX = x; startY = y; isDrawing = true; return; }
            if (mode === 'pan') { isPanning = true; panStartX = e.clientX; panStartY = e.clientY; panScrollLeft = canvasContainer.scrollLeft; panScrollTop = canvasContainer.scrollTop; canvas.style.cursor = 'grabbing'; return; }
            if (e.button === 2) return; 

            if (['autoLine', 'autoArea'].includes(mode)) {
                if (measureStep === 0) { isLoupeActive = true; measureStep = 1; updateLoupe(e, x, y); } 
                else if (measureStep === 1) { executeAutoMeasurement(x, y, mode); isLoupeActive = false; measureStep = 0; loupeCanvas.style.display = 'none'; }
                return;
            }

            if (['calibrate', 'distance', 'polygonal', 'area', 'arc', 'circle', 'dimension'].includes(mode)) {
                if (measureStep === 0) {
                    isLoupeActive = true; measureStep = 1; updateLoupe(e, x, y);
                } 
                else if (measureStep === 1) {
                    startX = x; startY = y; currentPath = [{x, y}]; isDrawing = true; measureStep = 2; updateLoupe(e, x, y);
                }
                else if (measureStep === 2) {
                    if (['calibrate', 'distance'].includes(mode)) { endX = x; endY = y; currentPath.push({x, y}); finishLineTool(); } 
                    else if (['dimension', 'arc', 'circle'].includes(mode)) { currentPath.push({x, y}); measureStep = 3; updateLoupe(e, x, y); }
                    else if (['polygonal', 'area'].includes(mode)) { const lastP = currentPath[currentPath.length - 1]; if (Math.hypot(x - lastP.x, y - lastP.y) > 5) currentPath.push({x, y}); updateLoupe(e, x, y); }
                }
                else if (measureStep === 3) {
                    if (['dimension', 'arc', 'circle'].includes(mode)) { currentPath.push({x, y}); finish3PointTool(); }
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const {x, y} = getMousePos(e);
            
            if (isLoupeActive || draggingPointIndex !== -1) updateLoupe(e, x, y);
            else loupeCanvas.style.display = 'none';

            if (mode === 'select') {
                if (draggingPointIndex !== -1 && editingMeasureId) {
                    const m = measurementsByPage[pageNum].find(val => val.id === editingMeasureId);
                    if (m) { m.points[draggingPointIndex] = {x, y}; recalculateMeasurement(m, scaleByPage[pageNum]); updateSidebar(); redraw(); }
                }
                else if (draggingLabel) { draggingLabel.lblOffset.x = x - draggingLabel.cx - dragOffsetX; draggingLabel.lblOffset.y = y - draggingLabel.cy - dragOffsetY; redraw(); }
                else if (isPanning) { canvasContainer.scrollLeft = panScrollLeft - (e.clientX - panStartX); canvasContainer.scrollTop = panScrollTop - (e.clientY - panStartY); }
                else { if (getLabelAtPos(x, y)) canvas.style.cursor = 'move'; else canvas.style.cursor = 'default'; }
                return;
            }
            
            if (mode === 'pan' && isPanning) { canvasContainer.scrollLeft = panScrollLeft - (e.clientX - panStartX); canvasContainer.scrollTop = panScrollTop - (e.clientY - panStartY); return; }
            
            if (mode === 'printArea' && isDrawing) { endX = x; endY = y; redraw(); ctx.strokeStyle = '#0ea5e9'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.strokeRect(startX, startY, endX - startX, endY - startY); ctx.fillStyle = 'rgba(14, 165, 233, 0.15)'; ctx.fillRect(startX, startY, endX - startX, endY - startY); ctx.setLineDash([]); return; }
            
            if (isDrawing && ['calibrate', 'distance', 'polygonal', 'area', 'arc', 'circle', 'dimension'].includes(mode)) { tempPoint = {x, y}; redraw(); }

            if (!isDrawing && !isPanning && !draggingLabel) { canvas.style.cursor = (mode === 'pan' || mode === 'printArea') ? 'crosshair' : 'crosshair'; }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (draggingPointIndex !== -1) { draggingPointIndex = -1; canvas.style.cursor = 'default'; loupeCanvas.style.display = 'none'; redraw(); return; }
            if (draggingLabel) { draggingLabel = null; return; }
            if (isPanning) { isPanning = false; canvas.style.cursor = (mode === 'select') ? 'default' : 'grab'; return; }
            
            if (mode === 'printArea' && isDrawing) {
                isDrawing = false; const {x, y} = getMousePos(e); endX = x; endY = y;
                const rx = Math.min(startX, endX); const ry = Math.min(startY, endY); const rw = Math.abs(endX - startX); const rh = Math.abs(endY - startY);
                redraw(); if (rw > 10 && rh > 10) printSelectedArea(rx, ry, rw, rh); setMode('select');
            }
        });
        
        canvas.addEventListener('mouseleave', () => { loupeCanvas.style.display = 'none'; isPanning = false; draggingPointIndex = -1; draggingLabel = null; });

        // -- FINISH TOOLS --
        function finishLineTool() {
            isDrawing = false; isLoupeActive = false; measureStep = 0; loupeCanvas.style.display = 'none';
            const dist = Math.hypot(endX - startX, endY - startY); if (dist < 5) { currentPath = []; redraw(); return; }
            if (mode === 'calibrate') {
                let r = prompt("¿Cuántos metros reales tiene esta línea?");
                if (r) { r = parseFloat(r.replace(',', '.')); if (!isNaN(r) && r > 0) { 
                    scaleByPage[pageNum] = dist / r; lastKnownScale = scaleByPage[pageNum];
                    document.getElementById('scaleInfo').innerText = `ESC. PÁG. ${pageNum} (1m = ${Math.round(scaleByPage[pageNum])}px)`; 
                    document.getElementById('scaleInfo').className = "scale-badge calibrated"; 
                    alert(`¡Escala guardada!`); setMode('distance'); 
                }}
            } else if (mode === 'distance') {
                addMeasurement({ type: 'straight', cx: (startX+endX)/2, cy: (startY+endY)/2, points: [...currentPath], valM: (dist/scaleByPage[pageNum]).toFixed(2), valM2: null });
            } 
            currentPath = []; redraw();
        }

        function finish3PointTool() {
            isDrawing = false; isLoupeActive = false; measureStep = 0; loupeCanvas.style.display = 'none';
            const currScale = scaleByPage[pageNum];
            
            if (mode === 'dimension') {
                let distPx = Math.hypot(currentPath[1].x - currentPath[0].x, currentPath[1].y - currentPath[0].y);
                let cad = getCADOffset(currentPath[0], currentPath[1], currentPath[2]);
                let cx = (currentPath[0].x + currentPath[1].x)/2 + cad.d * cad.nx; let cy = (currentPath[0].y + currentPath[1].y)/2 + cad.d * cad.ny;
                addMeasurement({ type: 'dimension', cx: cx, cy: cy, points: [...currentPath], valM: (distPx/currScale).toFixed(2), valM2: null });
            }
            else if (mode === 'arc') {
                let arc = getArcThrough3Points(currentPath[0], currentPath[2], currentPath[1]);
                let lengthPx = arc ? arc.length : Math.hypot(currentPath[1].x - currentPath[0].x, currentPath[1].y - currentPath[0].y);
                let radiusPx = arc ? arc.r : 0;
                addMeasurement({ type: 'arc', cx: currentPath[2].x, cy: currentPath[2].y, points: [...currentPath], valM: (lengthPx/currScale).toFixed(2), radiusM: (radiusPx/currScale).toFixed(2), valM2: null });
            } 
            else if (mode === 'circle') {
                let circ = getArcThrough3Points(currentPath[0], currentPath[2], currentPath[1]);
                if (circ) {
                    let rM = circ.r / currScale; let area = Math.PI * rM * rM; let per = 2 * Math.PI * rM;
                    addMeasurement({ type: 'circle', cx: circ.cx, cy: circ.cy, r: circ.r, points: [...currentPath], valM: per.toFixed(2), valM2: area.toFixed(2), radiusM: rM.toFixed(2) });
                }
            }
            currentPath = []; tempPoint = null; redraw();
        }

        function finishPolyArea() {
            if (currentPath.length < 2) { currentPath = []; tempPoint = null; redraw(); return; }
            isDrawing = false; isLoupeActive = false; measureStep = 0; loupeCanvas.style.display = 'none';
            const currScale = scaleByPage[pageNum];
            
            if (mode === 'polygonal') {
                let t = 0; for (let i = 1; i < currentPath.length; i++) t += Math.hypot(currentPath[i].x - currentPath[i-1].x, currentPath[i].y - currentPath[i-1].y);
                const last = currentPath[currentPath.length-1]; addMeasurement({ type: 'polygonal', cx: last.x, cy: last.y, points: [...currentPath], valM: (t/currScale).toFixed(2), valM2: null });
            } else if (mode === 'area') {
                if (currentPath.length < 3) return; let per = 0, ar = 0, n = currentPath.length, cX = 0, cY = 0;
                for (let i = 0; i < n; i++) { const p1 = currentPath[i], p2 = currentPath[(i+1)%n]; per += Math.hypot(p2.x-p1.x, p2.y-p1.y); ar += (p1.x*p2.y - p2.x*p1.y); cX += p1.x; cY += p1.y; }
                addMeasurement({ type: 'area', cx: cX/n, cy: cY/n, points: [...currentPath], valM: (per/currScale).toFixed(2), valM2: (Math.abs(ar)/2/(currScale*currScale)).toFixed(2) });
            } 
            currentPath = []; tempPoint = null; redraw();
        }

        // --- RENDERIZADO VISUAL ---
        function drawLine(x1, y1, x2, y2, color, isHigh) {
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = isHigh ? '#ffffff' : color; ctx.lineWidth = isHigh ? 5 : 3; if(isHigh) { ctx.shadowColor = color; ctx.shadowBlur = 8; } ctx.stroke(); ctx.shadowBlur = 0;
            ctx.fillStyle = isHigh ? '#ffffff' : color; ctx.beginPath(); ctx.arc(x1, y1, isHigh? 4 : 2.5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(x2, y2, isHigh? 4 : 2.5, 0, Math.PI*2); ctx.fill();
        }
        function drawDimensionData(pts, color, isHigh) {
            let p1 = pts[0], p2 = pts[1], p3 = pts[2]; let cad = getCADOffset(p1, p2, p3); if (cad.len === 0) return;
            let off1x = p1.x + cad.d * cad.nx, off1y = p1.y + cad.d * cad.ny; let off2x = p2.x + cad.d * cad.nx, off2y = p2.y + cad.d * cad.ny;
            ctx.strokeStyle = isHigh ? '#ffffff' : color; if(isHigh) { ctx.shadowColor = color; ctx.shadowBlur = 8; }
            ctx.lineWidth = isHigh ? 3 : 1.5; let extDir = cad.d >= 0 ? 1 : -1;
            ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(off1x + extDir * 8 * cad.nx, off1y + extDir * 8 * cad.ny); ctx.moveTo(p2.x, p2.y); ctx.lineTo(off2x + extDir * 8 * cad.nx, off2y + extDir * 8 * cad.ny); ctx.stroke();
            ctx.lineWidth = isHigh ? 4 : 2; ctx.beginPath(); ctx.moveTo(off1x, off1y); ctx.lineTo(off2x, off2y); ctx.stroke();
            let tL = 5; let tx = cad.nx * tL; let ty = cad.ny * tL; let dxT = (cad.dx / cad.len) * tL; let dyT = (cad.dy / cad.len) * tL;
            ctx.lineWidth = isHigh ? 4 : 2; ctx.beginPath(); ctx.moveTo(off1x - dxT + tx, off1y - dyT + ty); ctx.lineTo(off1x + dxT - tx, off1y + dyT - ty); ctx.moveTo(off2x - dxT + tx, off2y - dyT + ty); ctx.lineTo(off2x + dxT - tx, off2y + dyT - ty); ctx.stroke(); ctx.shadowBlur = 0;
        }
        function drawPathData(pts, color, isClosed, isHigh) {
            ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
            if (isClosed) { ctx.closePath(); ctx.fillStyle = hexToRgba(color, isHigh ? 0.3 : 0.15); ctx.fill(); }
            ctx.strokeStyle = isHigh ? '#ffffff' : color; ctx.lineWidth = isHigh ? 5 : 3; if(isHigh) { ctx.shadowColor = color; ctx.shadowBlur = 8; } ctx.stroke(); ctx.shadowBlur = 0;
            ctx.fillStyle = isHigh ? '#ffffff' : color; pts.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, isHigh? 4 : 2.5, 0, Math.PI*2); ctx.fill(); });
        }
        function drawCircleData(cx, cy, r, color, isHigh) {
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fillStyle = hexToRgba(color, isHigh ? 0.3 : 0.15); ctx.fill();
            ctx.strokeStyle = isHigh ? '#ffffff' : color; ctx.lineWidth = isHigh ? 5 : 3; if(isHigh) { ctx.shadowColor = color; ctx.shadowBlur = 8; } ctx.stroke(); ctx.shadowBlur = 0;
        }
        function drawArcData(pts, color, isHigh) {
            let arc = getArcThrough3Points(pts[0], pts[2], pts[1]); ctx.beginPath();
            if (arc) ctx.arc(arc.cx, arc.cy, arc.r, arc.startAngle, arc.endAngle, arc.anticlockwise); else { ctx.moveTo(pts[0].x, pts[0].y); ctx.lineTo(pts[1].x, pts[1].y); }
            ctx.strokeStyle = isHigh ? '#ffffff' : color; ctx.lineWidth = isHigh ? 5 : 3; if(isHigh) { ctx.shadowColor = color; ctx.shadowBlur = 8; } ctx.stroke(); ctx.shadowBlur = 0;
            ctx.fillStyle = isHigh ? '#ffffff' : color; pts.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, isHigh ? 4 : 2.5, 0, Math.PI*2); ctx.fill(); });
        }

        function renderLabel(x, y, text, color, isHigh) {
            const lines = text.split('\n'); ctx.fillStyle = isHigh ? "#ffffff" : "rgba(255, 255, 255, 0.95)"; ctx.shadowColor = isHigh ? color : "rgba(0,0,0,0.15)"; ctx.shadowBlur = isHigh ? 12 : 6; ctx.shadowOffsetY = isHigh ? 0 : 3;
            ctx.beginPath(); ctx.roundRect(x - 50, y - 14, 100, lines.length > 1 ? 32 : 18, 4); ctx.fill(); ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
            ctx.fillStyle = "#0f172a"; ctx.font = "bold 10px Inter, sans-serif"; ctx.textAlign = "center";
            lines.forEach((l, i) => { if(i>0) {ctx.fillStyle = color; ctx.font = "bold 10px Inter, sans-serif";} ctx.fillText(l, x, y + 0 + (i*13)); });
        }
        
        function redraw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height); if (img.src) ctx.drawImage(img, 0, 0);
            
            const list = measurementsByPage[pageNum] || [];
            const normalList = list.filter(m => m.id !== highlightedMeasureId);
            const highList = list.filter(m => m.id === highlightedMeasureId);
            const sortedList = [...normalList, ...highList];

            // 1. Dibujar Formas Guardadas
            sortedList.forEach(m => {
                const isHigh = (m.id === highlightedMeasureId); const col = m.color;
                if (m.type === 'autoArea' || m.type === 'autoLine') { 
                    const tCanv = document.createElement('canvas'); tCanv.width = canvas.width; tCanv.height = canvas.height;
                    const tc = tCanv.getContext('2d'); tc.drawImage(m.img, 0, 0);
                    tc.globalCompositeOperation = 'source-in'; tc.fillStyle = col; tc.fillRect(0, 0, canvas.width, canvas.height);
                    if (isHigh) { ctx.shadowColor = col; ctx.shadowBlur = 12; } ctx.drawImage(tCanv, 0, 0); ctx.shadowBlur = 0;
                }
                else if (m.type === 'straight') drawLine(m.points[0].x, m.points[0].y, m.points[1].x, m.points[1].y, col, isHigh);
                else if (m.type === 'dimension') drawDimensionData(m.points, col, isHigh);
                else if (m.type === 'polygonal') drawPathData(m.points, col, false, isHigh);
                else if (m.type === 'area') drawPathData(m.points, col, true, isHigh);
                else if (m.type === 'circle') drawCircleData(m.cx, m.cy, m.r, col, isHigh);
                else if (m.type === 'arc') drawArcData(m.points, col, isHigh);
            });

            // 2. Previsualización de dibujo actual
            if (isDrawing && currentPath.length > 0) {
                if (['calibrate', 'distance'].includes(mode) && tempPoint) { 
                    drawLine(currentPath[0].x, currentPath[0].y, tempPoint.x, tempPoint.y, mode==='calibrate'?'#ef4444':'#0ea5e9', false); 
                }
                else if (['arc', 'circle', 'dimension'].includes(mode)) {
                    if (currentPath.length === 1 && tempPoint) {
                        let cCol = mode === 'dimension' ? 'var(--cad)' : mode === 'arc' ? 'var(--curve)' : 'var(--circle)';
                        drawLine(currentPath[0].x, currentPath[0].y, tempPoint.x, tempPoint.y, cCol, false);
                    }
                    else if (currentPath.length === 2 && tempPoint) {
                        if (mode === 'dimension') drawDimensionData([currentPath[0], currentPath[1], tempPoint], 'var(--cad)', false);
                        else {
                            let arc = getArcThrough3Points(currentPath[0], tempPoint, currentPath[1]);
                            if (arc) {
                                ctx.beginPath(); 
                                if(mode === 'arc') ctx.arc(arc.cx, arc.cy, arc.r, arc.startAngle, arc.endAngle, arc.anticlockwise);
                                else ctx.arc(arc.cx, arc.cy, arc.r, 0, Math.PI*2);
                                ctx.strokeStyle = mode==='arc'?'var(--curve)':'var(--circle)'; ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.stroke(); ctx.setLineDash([]);
                                ctx.fillStyle = mode==='arc'?'var(--curve)':'var(--circle)';
                                [currentPath[0], currentPath[1], tempPoint].forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2); ctx.fill(); });
                            } else {
                                drawLine(currentPath[0].x, currentPath[0].y, currentPath[1].x, currentPath[1].y, mode==='arc'?'var(--curve)':'var(--circle)', false);
                            }
                        }
                    }
                }
                else if (['polygonal', 'area'].includes(mode)) {
                    ctx.beginPath(); ctx.moveTo(currentPath[0].x, currentPath[0].y); for (let i = 1; i < currentPath.length; i++) ctx.lineTo(currentPath[i].x, currentPath[i].y);
                    if (tempPoint) ctx.lineTo(tempPoint.x, tempPoint.y); if (mode === 'area' && currentPath.length > 2 && tempPoint == null) ctx.closePath();
                    const dC = mode === 'area' ? '#10b981' : '#f59e0b'; ctx.strokeStyle = dC; ctx.lineWidth = 2; ctx.setLineDash([6, 6]); ctx.stroke(); ctx.setLineDash([]);
                    ctx.fillStyle = dC; currentPath.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2); ctx.fill(); });
                }
            }

            // 3. Dibujar Etiquetas
            sortedList.forEach(m => {
                const isHigh = (m.id === highlightedMeasureId);
                if (m.cx === undefined) {
                    if (m.type === 'straight') { m.cx = (m.points[0].x + m.points[1].x)/2; m.cy = (m.points[0].y + m.points[1].y)/2; }
                    else if (m.type === 'area') { let cx=0,cy=0; m.points.forEach(p=>{cx+=p.x;cy+=p.y;}); m.cx=cx/m.points.length; m.cy=cy/m.points.length; }
                    else if (m.type === 'polygonal') { m.cx = m.points[m.points.length-1].x; m.cy = m.points[m.points.length-1].y; }
                }
                if (!m.lblOffset) m.lblOffset = { x: 0, y: -30 }; 
                let rx = m.cx + m.lblOffset.x, ry = m.cy + m.lblOffset.y;
                
                let lbl = m.name + '\n'; lbl += (m.type === 'area' || m.type === 'autoArea' || m.type === 'circle') ? `${m.valM2} m²` : `${m.valM} m`;
                let color = m.type.toLowerCase().includes('area') ? '#10b981' : m.type.toLowerCase().includes('line') ? '#8b5cf6' : m.type === 'dimension' ? 'var(--cad)' : m.type === 'straight' ? '#0ea5e9' : '#f59e0b';

                if (Math.hypot(m.lblOffset.x, m.lblOffset.y) > 25 && m.type !== 'dimension') {
                    ctx.beginPath(); ctx.moveTo(m.cx, m.cy); ctx.lineTo(rx, ry);
                    ctx.strokeStyle = isHigh ? m.color : "rgba(15, 23, 42, 0.4)"; ctx.setLineDash([4,4]); ctx.lineWidth = isHigh ? 2 : 1; ctx.stroke(); ctx.setLineDash([]);
                }
                renderLabel(rx, ry, lbl, m.color, isHigh);
            });

            // 4. Dibujar Nodos de Edición
            if (editingMeasureId) {
                const m = list.find(val => val.id === editingMeasureId);
                if (m && m.points && m.type !== 'autoArea' && m.type !== 'autoLine') {
                    ctx.fillStyle = '#ffffff'; ctx.lineWidth = 2; ctx.strokeStyle = '#0ea5e9';
                    m.points.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); });
                }
            }
        }
    </script>
</body>
